; C_StateMachine PlatformIO example, also the board build matrix.
;
;   pio run                          build every board below
;   pio run -e esp32dev              build one board
;   pio run -e esp32dev -t upload -t monitor
;   pio run -e native -t exec        build and run on the desktop
;
; Copying this example into your own project? Change lib_deps to
;   lib_deps = endurodave/C_StateMachine@^1.3.0
; (here it points at this repository so every commit is tested).
; C_StateMachine depends on endurodave/C_Allocator, which PlatformIO
; installs with it.

[env]
lib_deps = symlink://../../..
monitor_speed = 115200

; ESP32 (Xtensa, FreeRTOS): std::mutex is available, so the allocator locks with it
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; ESP32-C3 (RISC-V, FreeRTOS)
[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

; STM32 Nucleo-F401RE (Cortex-M4, bare metal): no std::mutex, so no lock
; (single-threaded). With an RTOS, add e.g. -DALLOC_LOCK_FREERTOS (see C_Allocator).
[env:nucleo_f401re]
platform = ststm32
board = nucleo_f401re
framework = arduino

; STM32F4 Discovery (STM32F407VG Cortex-M4, bare metal).
; Flashed over its ST-LINK/V2, which has no USB serial port: Serial goes to
; USART6 (TX PC6, RX PC7), 115200 8N1, through a 3.3 V USB-UART adapter.
[env:disco_f407vg]
platform = ststm32
board = disco_f407vg
framework = arduino
upload_protocol = stlink
build_flags = -DSERIAL_UART_INSTANCE=6 -DPIN_SERIAL_TX=PC6 -DPIN_SERIAL_RX=PC7

; Raspberry Pi Pico (RP2040 Cortex-M0+, bare metal): no std::mutex, so no lock
[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
board_build.core = earlephilhower
framework = arduino

; Arduino Mega 2560 (AVR): no C++ standard library, so no lock
[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino

; Desktop (Linux, macOS, or Windows with MinGW): locks with std::mutex
[env:native]
platform = native
